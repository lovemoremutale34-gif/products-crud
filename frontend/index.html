<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Product Showcase CRUD</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f9; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        input, button { padding: 10px; margin: 5px 0; width: 100%; box-sizing: border-box; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #007bff; color: white; }
        .actions button { width: auto; margin-right: 5px; padding: 5px 10px; cursor: pointer; }
        .edit-btn { background-color: #ffc107; border: none; }
        .delete-btn { background-color: #dc3545; color: white; border: none; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Tech Product Showcase (CRUD)</h2>
        
        <!-- Form to Create / Update -->
        <form id="productForm">
            <input type="hidden" id="productId">
            <input type="text" id="product_name" placeholder="Product Name" required>
            <input type="text" id="brand" placeholder="Brand" required>
            <input type="text" id="category" placeholder="Category" required>
            <input type="number" step="0.01" id="price" placeholder="Price" required>
            <input type="number" id="stock" placeholder="Stock Quantity" required>
            <input type="text" id="description" placeholder="Description" required>
            <button type="submit" id="submitBtn">Add Product</button>
        </form>

        <!-- Table to Display Records -->
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Brand</th>
                    <th>Price</th>
                    <th>Stock</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="productTableBody">
                <!-- Data will be loaded here -->
            </tbody>
        </table>
    </div>

    <script src="app.js"></script>
</body>
</html>
